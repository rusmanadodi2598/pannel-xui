# Bot Auto-Order stack (PRD §19) — bot + Nginx (TLS).
# PostgreSQL + Redis DIPINJAM dari HOST (service native systemd:
# postgresql@16-main di :5432, redis-server di :6379) — TIDAK ada container
# DB sendiri di stack ini. Karena PG/Redis host hanya bind 127.0.0.1, bot dan
# nginx memakai network_mode: host (bukan bridge) agar bisa langsung mencapai
# loopback host. Konsekuensi yang wajib diketahui operator:
#   - DATABASE_URL / REDIS_URL memakai 127.0.0.1 (bukan nama service compose).
#   - Port bot (WEBHOOK_PORT, default 8443) dan nginx (80/443) bind LANGSUNG
#     di host — pastikan bebas sebelum `up`.
#   - Staging saat ini menjalankan bot langsung di host (mis. /tmp/bot-staging
#     di :8443): stop proses tersebut dulu agar port tidak bentrok.
name: bot-order

services:
  bot:
    build: .
    network_mode: host        # tembus PG/Redis host di 127.0.0.1
    env_file:
      - path: .env
        required: false   # wajib diisi saat runtime; bot fail-fast jika kosong
    environment:
      # Service host-native (staging): postgresql@16-main + redis-server.
      # Nilai di bawah menang atas env_file.
      DATABASE_URL: postgres://bot:bot@127.0.0.1:5432/bot?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    network_mode: host        # TLS 80/443 bind langsung di host
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?set BOT_DOMAIN in .env}
    volumes:
      # Template nginx — BOT_DOMAIN di-substitusi otomatis oleh image resmi.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Sertifikat TLS: default folder ./certs (fullchain.pem + privkey.pem).
      # Alternatif Let's Encrypt di host: mount /etc/letsencrypt:/etc/letsencrypt:ro
      #   lalu di nginx.conf pakai:
      #   ssl_certificate /etc/letsencrypt/live/${BOT_DOMAIN}/fullchain.pem;
      #   ssl_certificate_key /etc/letsencrypt/live/${BOT_DOMAIN}/privkey.pem;
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - bot
    restart: unless-stopped
