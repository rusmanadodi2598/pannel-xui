# Nginx reverse proxy — TLS termination untuk webhook Telegram bot.
# Template image nginx resmi: ${BOT_DOMAIN} di-substitusi otomatis saat start.    # HTTP → HTTPS (produksi). Untuk dev tanpa sertifikat, ganti blok ini dengan
    # blok location proxy (salin dari server 443) dan komentari server 443.
    # Endpoint bot berversi: /api/v1/* (health, webhooks/telegram, webhooks/payments).
server {
    listen 80;
    server_name ${BOT_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${BOT_DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 1m;

    location / {
        # network_mode: host — bot bind di loopback host, bukan DNS compose.
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
